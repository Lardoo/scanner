<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simulate Cash Payment</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://www.enterprisestorageforum.com/wp-content/uploads/2023/06/esf-vulnerability-scanning-and-management-696x453.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .cash-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .cash-container h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }

    .cash-icon {
      font-size: 48px;
      color: #27ae60;
      margin-bottom: 15px;
    }

    .cash-container p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #555;
    }

    .cash-container button, .back-button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
    }

    .cash-container button:hover, .back-button:hover {
      background-color: #219150;
    }
  </style>
</head>
<body>
  <div class="cash-container">
    <div class="cash-icon">💵</div>
    <h2> Cash Payment</h2>
    <p>I confirm that i have made cash payment</p>
    
    <form method="post">
      {% csrf_token %}
      <button type="submit">Confirm Cash Payment</button>
    </form>

    <a href="{% url 'dashboard' %}" class="back-button">← Back to Dashboard</a>
  </div>
</body>
</html>
